<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Строительные калькуляторы, тоннаж металлопроката и сметы: бетон, арматура, кирпич, кровля, отделка, земляные работы. Работает в браузере, данные хранятся у вас." />
    <meta name="theme-color" content="#18181b" />
    <title>СтройРасчёт — калькуляторы и сметы</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      try {
        var t = JSON.parse(localStorage.getItem('sr-settings') || '{}').state?.theme || 'system'
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
